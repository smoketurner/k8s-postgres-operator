[package]
name = "postgres-operator"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "A Kubernetes operator for managing PostgreSQL clusters"
license = "MIT"

[dependencies]
# Kubernetes
# kube 3.x with k8s-openapi 0.27 (Kubernetes 1.35 native types)
kube = { version = "=3.1.0", default-features = false, features = ["runtime", "derive", "client", "rustls-tls", "aws-lc-rs", "ws", "unstable-runtime", "admission"] }
k8s-openapi = { version = "=0.27.1", default-features = false, features = ["v1_35"] }

# Async runtime
tokio = { version = "=1.52.3", default-features = false, features = ["full"] }
futures = { version = "=0.3.32", default-features = false }

# Serialization
serde = { version = "=1.0.228", default-features = false, features = ["derive"] }
serde_json = { version = "=1.0.150", default-features = false }
serde-saphyr = { version = "=0.0.26", default-features = false, features = ["serialize", "deserialize"] }
schemars = { version = "=1.2.1", default-features = false }

# Error handling
thiserror = { version = "=2.0.18", default-features = false }

# Logging/Tracing
tracing = { version = "=0.1.44", default-features = false }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["std", "fmt", "env-filter", "json"] }

# HTTP server for health endpoints and metrics
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
axum-server = { version = "=0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
prometheus-client = { version = "=0.24.1", default-features = false }
rustls-pemfile = { version = "=2.2.0", default-features = false, features = ["std"] }

# HTTP client for Patroni API queries
hyper = { version = "=1.9.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["tokio", "client", "client-legacy"] }
http-body-util = { version = "=0.1.3", default-features = false }
bytes = { version = "=1.11.1", default-features = false }

# Utilities
jiff = { version = "=0.2.24", default-features = false, features = ["std"] }
rand = { version = "=0.10.1", default-features = false }
base64 = { version = "=0.22.1", default-features = false }

# TLS crypto backend for rustls
rustls = { version = "=0.23.40", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }

# PostgreSQL client for direct SQL connections
tokio-postgres = { version = "=0.7.17", default-features = false, features = ["runtime"] }
tokio-postgres-rustls-improved = { version = "=0.16.2", default-features = false }
rustls-pki-types = { version = "=1.14.1", default-features = false, features = ["std"] }

# Leader election
kube-leader-election = { version = "=0.43.0", default-features = false }
hostname = { version = "=0.4.2", default-features = false }

[dev-dependencies]
tokio-test = { version = "=0.4.5", default-features = false }
uuid = { version = "=1.23.1", default-features = false, features = ["v4"] }
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }

[lints.clippy]
# Panic-prevention lints
# See: https://blog.reverberate.org/2025/02/03/no-panic-rust.html
#
# Production code must never panic. These lints enforce panic-free patterns.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
exit = "deny"

# Panic patterns inside Result-returning functions
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
get_unwrap = "deny"

# Indexing can panic - use .get() instead
indexing_slicing = "deny"

# String slicing can panic on non-UTF8 boundaries
string_slice = "warn"

[lints.rust]
# Unsafe code restrictions
unsafe_code = "deny"

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[[test]]
name = "unit"
path = "tests/unit/mod.rs"

[[test]]
name = "proptest"
path = "tests/proptest/mod.rs"
