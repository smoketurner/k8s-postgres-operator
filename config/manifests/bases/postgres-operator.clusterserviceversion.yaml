apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    capabilities: Basic Install
    categories: Database
    containerImage: ghcr.io/smoketurner/k8s-postgres-operator:0.2.0
    description: |
      Manages PostgreSQL clusters using Spilo (Patroni + PostgreSQL + WAL-G)
      for high availability, with declarative database/role provisioning,
      blue-green major version upgrades, scheduled backups, and PgBouncer
      connection pooling.
    repository: https://github.com/smoketurner/k8s-postgres-operator
    support: https://github.com/smoketurner/k8s-postgres-operator/issues
    alm-examples: |-
      [
        {
          "apiVersion": "postgres-operator.smoketurner.com/v1alpha1",
          "kind": "PostgresCluster",
          "metadata": { "name": "pg-sample" },
          "spec": {
            "version": "16",
            "replicas": 3,
            "storage": { "size": "10Gi" },
            "tls": {
              "enabled": true,
              "issuerRef": { "name": "selfsigned-cluster-issuer", "kind": "ClusterIssuer" }
            }
          }
        },
        {
          "apiVersion": "postgres-operator.smoketurner.com/v1alpha1",
          "kind": "PostgresDatabase",
          "metadata": { "name": "app-db" },
          "spec": {
            "clusterRef": { "name": "pg-sample" },
            "database": { "name": "app", "owner": "app_owner" },
            "roles": [
              {
                "name": "app_user",
                "secretName": "app-db-credentials",
                "privileges": ["LOGIN"]
              }
            ]
          }
        },
        {
          "apiVersion": "postgres-operator.smoketurner.com/v1alpha1",
          "kind": "PostgresUpgrade",
          "metadata": { "name": "pg-sample-upgrade" },
          "spec": {
            "sourceCluster": { "name": "pg-sample" },
            "targetVersion": "17"
          }
        }
      ]
  name: postgres-operator.v0.0.0
  namespace: placeholder
spec:
  displayName: PostgreSQL Operator
  description: |
    The **PostgreSQL Operator** manages production-grade PostgreSQL clusters
    on Kubernetes. Built on [Spilo](https://github.com/zalando/spilo)
    (PostgreSQL + Patroni + WAL-G), it provides:

    ### High availability
    - Automatic primary failover via Patroni
    - Configurable replica count and topology spread
    - PodDisruptionBudget generated per cluster

    ### Declarative data management
    - **PostgresCluster** — the cluster itself (Spilo StatefulSet, Patroni DCS, services)
    - **PostgresDatabase** — databases, roles, grants, extensions, with per-role credential Secrets
    - **PostgresUpgrade** — blue-green major-version upgrades via logical replication, with verification + rollback

    ### Backups
    - Continuous WAL archiving via WAL-G to S3 / S3-compatible storage
    - Encryption **required** for backups (security by default)
    - Scheduled base backups + optional logical (`pg_dumpall`) backups via CronJob

    ### Connection pooling
    - PgBouncer Deployment per cluster, session/transaction/statement pool modes
    - Optional replica pooler for read-heavy workloads

    ### Kubernetes-native UX
    - `kubectl scale postgrescluster/name --replicas=N` (scale subresource)
    - `kubectl get all` / `kubectl get databases` integration via CRD categories
    - Standard `metav1.Condition` status + Kubernetes Events on phase transitions
    - Prometheus Operator `ServiceMonitor` integration

    ### Safety by default
    - TLS enabled by default for PostgreSQL connections (cert-manager Issuer required)
    - Backup encryption required
    - ValidatingAdmissionWebhook enforces backup, TLS, immutability, and production-namespace policies
    - PostgreSQL version downgrades on Running clusters are rejected

    ## Prerequisites
    - **cert-manager** v1.0+ — required for webhook TLS and per-cluster PostgreSQL TLS
    - **Kubernetes 1.35+**
    - Optional: **Prometheus Operator** for ServiceMonitor generation
    - Optional: **KEDA** for replica auto-scaling

    See the [project README](https://github.com/smoketurner/k8s-postgres-operator)
    for full configuration reference, upgrade procedures, and operational runbooks.
  keywords:
    - postgresql
    - postgres
    - database
    - patroni
    - spilo
    - wal-g
    - ha
    - high-availability
    - backup
    - upgrade
    - pgbouncer
  links:
    - name: Source
      url: https://github.com/smoketurner/k8s-postgres-operator
    - name: Architecture
      url: https://github.com/smoketurner/k8s-postgres-operator/blob/main/docs/architecture.md
    - name: Operations
      url: https://github.com/smoketurner/k8s-postgres-operator/blob/main/docs/operations.md
    - name: Backup & restore
      url: https://github.com/smoketurner/k8s-postgres-operator/blob/main/docs/backup-restore.md
    - name: Upgrades
      url: https://github.com/smoketurner/k8s-postgres-operator/blob/main/docs/upgrades.md
  maintainers:
    - name: Justin Plock
      email: justin@plock.net
  provider:
    name: smoketurner
    url: https://github.com/smoketurner
  maturity: alpha
  minKubeVersion: 1.35.0
  # Cluster-scoped operator: it watches every namespace by default but is also
  # happy installed into a single namespace (it'll only see resources there).
  installModes:
    - supported: true
      type: OwnNamespace
    - supported: true
      type: SingleNamespace
    - supported: false
      type: MultiNamespace
    - supported: true
      type: AllNamespaces
