      deployments:
      - label:
          app.kubernetes.io/component: controller
          app.kubernetes.io/name: postgres-operator
        name: postgres-operator
        spec:
          minReadySeconds: 5
          progressDeadlineSeconds: 300
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/name: postgres-operator
          strategy:
            type: Recreate
          template:
            metadata:
              labels:
                app.kubernetes.io/component: controller
                app.kubernetes.io/name: postgres-operator
            spec:
              containers:
              - env:
                - name: RUST_LOG
                  value: info
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                image: ghcr.io/smoketurner/k8s-postgres-operator:0.2.0
                imagePullPolicy: Always
                livenessProbe:
                  httpGet:
                    path: /healthz
                    port: 8080
                  initialDelaySeconds: 15
                  periodSeconds: 20
                name: operator
                ports:
                - containerPort: 8080
                  name: health
                  protocol: TCP
                - containerPort: 8443
                  name: webhook
                  protocol: TCP
                readinessProbe:
                  httpGet:
                    path: /readyz
                    port: 8080
                  initialDelaySeconds: 5
                  periodSeconds: 10
                resources:
                  limits:
                    cpu: 500m
                    memory: 256Mi
                  requests:
                    cpu: 100m
                    memory: 128Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
                  readOnlyRootFilesystem: true
                volumeMounts:
                - mountPath: /etc/webhook/certs
                  name: webhook-certs
                  readOnly: true
              securityContext:
                fsGroup: 1000
                runAsNonRoot: true
                runAsUser: 1000
              serviceAccountName: postgres-operator
              terminationGracePeriodSeconds: 10
              volumes:
              - name: webhook-certs
                secret:
                  optional: true
                  secretName: postgres-operator-webhook-tls
