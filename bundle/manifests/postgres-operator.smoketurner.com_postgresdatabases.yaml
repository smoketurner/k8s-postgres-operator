apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  creationTimestamp: null
  name: postgresdatabases.postgres-operator.smoketurner.com
spec:
  group: postgres-operator.smoketurner.com
  names:
    categories:
    - databases
    - postgresql
    - all
    kind: PostgresDatabase
    listKind: PostgresDatabaseList
    plural: postgresdatabases
    shortNames:
    - pgdb
    singular: postgresdatabase
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.clusterRef.name
      name: Cluster
      type: string
    - jsonPath: .spec.database.name
      name: Database
      type: string
    - jsonPath: .spec.database.owner
      name: Owner
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.reason
      name: Reason
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          spec:
            description: |
              Desired state of a database to provision inside a parent
              PostgresCluster. The operator creates the database, roles,
              grants, and extensions, and writes per-role credentials to
              Kubernetes Secrets.
            properties:
              clusterRef:
                description: Reference to the parent PostgresCluster
                properties:
                  name:
                    description: Name of the PostgresCluster
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace of the PostgresCluster (defaults to same
                      namespace)
                    type: string
                required:
                - name
                type: object
              database:
                description: Database to create
                properties:
                  connectionLimit:
                    description: Connection limit for the database (-1 for unlimited)
                    minimum: -1
                    type: integer
                  encoding:
                    description: Encoding for the database (default UTF8)
                    type: string
                  locale:
                    description: Locale for the database
                    type: string
                  name:
                    description: Name of the database to create
                    minLength: 1
                    pattern: ^[a-z][a-z0-9_]*$
                    type: string
                  owner:
                    description: Owner role for the database
                    minLength: 1
                    type: string
                required:
                - name
                - owner
                type: object
              extensions:
                description: Extensions to enable in the database
                items:
                  type: string
                type: array
              grants:
                description: Permission grants to apply
                items:
                  description: |
                    One privilege grant. Applied as a PostgreSQL `GRANT`
                    statement after the database and roles exist.
                  properties:
                    allFunctions:
                      default: false
                      description: Grant on all functions in schema
                      type: boolean
                    allSequences:
                      default: false
                      description: Grant on all sequences in schema
                      type: boolean
                    allTables:
                      default: false
                      description: Grant on all tables in schema
                      type: boolean
                    privileges:
                      description: Table privileges to grant
                      items:
                        enum:
                        - SELECT
                        - INSERT
                        - UPDATE
                        - DELETE
                        - TRUNCATE
                        - REFERENCES
                        - TRIGGER
                        - ALL
                        type: string
                      type: array
                    role:
                      description: Role to grant privileges to
                      minLength: 1
                      type: string
                    schema:
                      default: public
                      description: Schema to grant on (default public)
                      type: string
                  required:
                  - role
                  type: object
                type: array
              roles:
                description: Roles to create with credentials
                items:
                  description: |
                    One PostgreSQL role. The operator creates a Kubernetes
                    Secret named `secretName` holding the generated
                    credentials (username, password, host, port, database,
                    connection-string, jdbc-url).
                  properties:
                    connectionLimit:
                      description: Connection limit for this role (-1 for unlimited)
                      minimum: -1
                      type: integer
                    login:
                      default: true
                      description: Whether this role can log in (default true)
                      type: boolean
                    name:
                      description: Name of the role to create
                      minLength: 1
                      pattern: ^[a-z][a-z0-9_]*$
                      type: string
                    privileges:
                      description: Privileges for this role
                      items:
                        enum:
                        - CREATEDB
                        - CREATEROLE
                        - SUPERUSER
                        - LOGIN
                        - REPLICATION
                        - BYPASS_RLS
                        type: string
                      type: array
                    secretName:
                      description: Name of the Secret to create with credentials
                      minLength: 1
                      type: string
                  required:
                  - name
                  - secretName
                  type: object
                type: array
            required:
            - clusterRef
            - database
            type: object
            x-kubernetes-validations:
            - message: database name cannot be a reserved PostgreSQL database (postgres,
                template0, template1)
              rule: '!(self.database.name in [''postgres'', ''template0'', ''template1''])'
          status:
            description: |
              Observed provisioning state of the database. `phase` is the
              coarse lifecycle position; `conditions[]` carries the
              detailed `ClusterReady` / `DatabaseCreated` / `RolesCreated`
              / `GrantsApplied` / `SecretsCreated` / `Ready` breakdown.
            properties:
              conditions:
                description: Standard Kubernetes status conditions (metav1.Condition)
                items:
                  description: |
                    A single condition. Same shape as Kubernetes
                    `metav1.Condition` — `lastTransitionTime` only advances
                    when `status` changes.
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned
                      format: date-time
                      type: string
                    message:
                      description: Human-readable message
                      type: string
                    observedGeneration:
                      description: Generation observed when the condition was set
                      format: int64
                      type: integer
                    reason:
                      description: Human-readable reason for the condition
                      type: string
                    status:
                      description: Status of the condition (True, False, Unknown)
                      type: string
                    type:
                      description: Type of condition
                      type: string
                  required:
                  - type
                  - status
                  - reason
                  - message
                  - lastTransitionTime
                  type: object
                type: array
              connectionInfo:
                description: Connection information for the database
                properties:
                  database:
                    description: Database name
                    type: string
                  host:
                    description: Primary service hostname
                    type: string
                  port:
                    description: PostgreSQL port
                    type: integer
                type: object
              credentialSecrets:
                description: List of secrets created for role credentials
                items:
                  type: string
                type: array
              message:
                description: Human-readable explanation paired with phase and reason
                type: string
              observedGeneration:
                description: Last observed generation
                format: int64
                type: integer
              phase:
                description: Current phase of the database provisioning
                enum:
                - Pending
                - Creating
                - Ready
                - Updating
                - Failed
                - Deleting
                type: string
              reason:
                description: Short CamelCase explanation paired with phase
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
status:
  acceptedNames:
    kind: ""
    plural: ""
  conditions: null
  storedVersions: null
