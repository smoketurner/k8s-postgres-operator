# Default values for postgres-operator.

# Operator image configuration
# Note: The repository is updated automatically during release workflow
image:
  repository: ghcr.io/smoketurner/k8s-postgres-operator
  tag: ""  # Defaults to appVersion
  pullPolicy: IfNotPresent

# Image pull secrets for private registries
imagePullSecrets: []
# - name: regcred

# Override the name of the chart
nameOverride: ""
fullnameOverride: ""

# Number of operator replicas (only 1 is active due to leader election)
replicaCount: 1

# Operator configuration
operator:
  # Log level (trace, debug, info, warn, error)
  logLevel: info

  # Leader election settings
  leaderElection:
    enabled: true
    leaseDuration: 15
    renewDeadline: 10
    retryPeriod: 2

  # Health server port
  healthPort: 8080

# Service account configuration
serviceAccount:
  # Create service account
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account (generated if not set)
  name: ""

# RBAC configuration
rbac:
  # Create RBAC resources
  create: true

# Install the PostgresCluster CRD
crd:
  install: true
  # Keep CRD on chart uninstall (recommended to prevent data loss)
  keep: true

# Resource limits and requests
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Node selector for operator pod
nodeSelector: {}

# Tolerations for operator pod
tolerations: []

# Affinity rules for operator pod
affinity: {}

# Pod annotations
podAnnotations: {}

# Pod labels
podLabels: {}

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Liveness probe configuration
livenessProbe:
  httpGet:
    path: /healthz
    port: health
  initialDelaySeconds: 15
  periodSeconds: 20

# Readiness probe configuration
readinessProbe:
  httpGet:
    path: /readyz
    port: health
  initialDelaySeconds: 5
  periodSeconds: 10

# =============================================================================
# Validating admission webhook
# =============================================================================
# The operator ships a ValidatingWebhookConfiguration that enforces backup
# encryption, TLS issuer presence, immutability rules, and production-namespace
# constraints. The webhook server listens on container port 8443; the Service
# below fronts it at port 443 cluster-internally.
#
# By default we let cert-manager issue and renew the webhook TLS cert. If
# cert-manager is unavailable, set `webhook.certManager.enabled: false` and
# supply your own pre-created Secret (`webhook.tlsSecretName`) plus the CA
# bundle (`webhook.caBundle`) that the API server should trust.
webhook:
  # Set to false to skip the webhook entirely (not recommended — disables
  # operator-enforced validation, leaving only CRD schema/CEL checks).
  enabled: true

  # API-server-visible failure mode if the webhook is unreachable.
  # `Fail` rejects requests when the webhook is down; `Ignore` allows them.
  failurePolicy: Fail

  # Webhook call timeout (seconds). Must be 1-30.
  timeoutSeconds: 10

  # Restrict which namespaces are validated. Leaving this empty validates
  # every namespace. Example to require an opt-in label:
  #   namespaceSelector:
  #     matchLabels:
  #       postgres-operator.smoketurner.com/validate: "true"
  namespaceSelector: {}

  # Override the Secret name the operator pod mounts for the webhook TLS cert.
  # Defaults to `<release>-webhook-tls`.
  tlsSecretName: ""

  # CA bundle the API server should trust when calling the webhook.
  # Only used when certManager.enabled is false; otherwise cert-manager
  # injects the bundle via the cert-manager.io/inject-ca-from annotation.
  caBundle: ""

  certManager:
    # Use cert-manager to issue + renew the webhook TLS cert.
    enabled: true

    # Reference to an existing Issuer / ClusterIssuer. cert-manager must be
    # installed and the issuer must already exist.
    issuer:
      kind: ClusterIssuer
      name: selfsigned-cluster-issuer
      group: cert-manager.io

    # Certificate validity + early-renewal window.
    duration: 8760h    # 1 year
    renewBefore: 720h  # 30 days

    privateKey:
      algorithm: ECDSA
      size: 256

# =============================================================================
# NetworkPolicy for the operator pod
# =============================================================================
# Allows kubelet health probes + (when the webhook is enabled) API-server
# webhook calls inbound, and DNS + Kubernetes API access outbound. Disable
# if your cluster doesn't use NetworkPolicies or you manage them externally.
networkPolicy:
  enabled: false
  # Additional egress rules layered on top of the defaults (DNS + apiserver).
  # Each entry is a NetworkPolicyEgressRule. Useful if the operator needs
  # to reach external services (e.g. a private registry).
  extraEgress: []

# Prometheus ServiceMonitor (requires prometheus-operator)
serviceMonitor:
  enabled: false
  # Additional labels for the ServiceMonitor
  labels: {}
  # Scrape interval
  interval: 30s
  # Scrape timeout
  scrapeTimeout: 10s
  # Metric relabeling configs
  metricRelabelings: []
  # Relabeling configs
  relabelings: []

# Pod priority class name
priorityClassName: ""

# Termination grace period
terminationGracePeriodSeconds: 10

# Extra environment variables
extraEnv: []
# - name: MY_VAR
#   value: "my-value"

# Extra volume mounts
extraVolumeMounts: []

# Extra volumes
extraVolumes: []

# =============================================================================
# TLS Configuration (requires cert-manager)
# =============================================================================
# PREREQUISITE: cert-manager must be installed before deploying this operator.
# TLS is enabled by default on all PostgresCluster resources for security.
#
# Install cert-manager:
#   helm repo add jetstack https://charts.jetstack.io
#   helm install cert-manager jetstack/cert-manager \
#     --namespace cert-manager --create-namespace \
#     --set crds.enabled=true
#
# Create an Issuer/ClusterIssuer for your environment:
#   - Development: self-signed issuer
#   - Production: Let's Encrypt, HashiCorp Vault, or internal PKI
#
# See: https://cert-manager.io/docs/configuration/

# =============================================================================
# Auto-Scaling Configuration (optional - requires KEDA)
# =============================================================================
# OPTIONAL PREREQUISITE: KEDA must be installed for auto-scaling features.
# Auto-scaling is opt-in and configured per PostgresCluster via spec.scaling.
#
# Features:
#   - Reader auto-scaling: Scale read replicas based on CPU/connections
#   - Scale-to-zero: Scale development clusters to 0 when idle
#
# Install KEDA:
#   helm repo add kedacore https://kedacore.github.io/charts
#   helm install keda kedacore/keda --namespace keda --create-namespace
#
# For scale-to-zero, also install the KEDA HTTP Add-on:
#   helm install keda-http-add-on kedacore/keda-add-ons-http \
#     --namespace keda
#
# Example PostgresCluster with auto-scaling:
#   spec:
#     replicas: 3
#     scaling:
#       minReplicas: 3      # Minimum replicas (0 enables scale-to-zero)
#       maxReplicas: 10     # Maximum replicas for auto-scaling
#       metrics:
#         cpu:
#           targetUtilization: 70
#
# See: https://keda.sh/docs/latest/deploy/
